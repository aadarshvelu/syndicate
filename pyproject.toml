[project]
name = "syndicate"
version = "0.1.0"
description = "Personal AI news digest pipeline"
requires-python = ">=3.11"
dependencies = [
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "playwright>=1.44",
    "dspy>=3.2.1",
]

[project.scripts]
digest = "pipeline.main:main"
syndicate = "pipeline.orchestrator:main"
syndicate-cli = "pipeline.cli:main"
install-browsers = "pipeline.tools.install_browsers:main"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]
benchmark = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
